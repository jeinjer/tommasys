<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página no encontrada | Tommasys</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Saira:ital,wdth,wght@0,50..125,100..900;1,50..125,100..900&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #060606;
      --ink: #ffffff;
      --ink-muted: #a3a3a3;
      --orange: #e8601c;
      --orange-glow: rgba(232, 96, 28, 0.15);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    
    /* Background Glow */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60vw;
      height: 60vw;
      max-width: 600px;
      max-height: 600px;
      background: radial-gradient(circle, var(--orange-glow) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    
    .logo {
      width: 48px;
      height: auto;
      margin-bottom: 2rem;
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.1);
    }
    
    h1 {
      font-family: 'Saira', sans-serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    h2 {
      font-family: 'STIX Two Text', serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 400;
      color: var(--ink);
      margin-top: -1rem;
    }
    
    h2 em {
      color: var(--orange);
      font-style: italic;
    }
    
    p {
      color: var(--ink-muted);
      font-size: 1.125rem;
      max-width: 400px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--ink);
      color: var(--bg);
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 1.125rem;
      padding: 1rem 2.5rem;
      border-radius: 99px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .btn:hover {
      background: var(--orange);
      color: var(--ink);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(232, 96, 28, 0.3);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <a href="/">
      <img src="/favicon.svg" alt="Tommasys" class="logo" />
    </a>
    <h1>404</h1>
    <h2>No encontramos esta <em>página</em></h2>
    <p>El enlace que seguiste parece estar roto o la página ya no existe. No te preocupes, nuestros sistemas siguen en pie.</p>
    <a href="/" class="btn">
      Volver al Inicio
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>
</body>
</html>
